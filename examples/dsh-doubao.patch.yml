# DSH provider patch for Doubao (Volcano Ark, OpenAI-compatible).
# Keep credentials in DSH's local store, never in this file.
# Verify your own free quota and model availability in the Volcano Ark console before use.
# Supports screenshot input and tool calling; no fallback to another model.
# This example targets DSH 0.2.x; adjust the fields if your DSH version differs.
- id: llm-pi-ai
  config:
    providers:
      doubao:
        displayName: Doubao (Volcano Ark)
        apiKeyEnv: ARK_API_KEY
        api: openai-completions
        baseURL: https://ark.cn-beijing.volces.com/api/v3
        compat:
          thinkingFormat: openai
          supportsReasoningEffort: false
          supportsDeveloperRole: false
          supportsStore: false
        models:
          - id: doubao-seed-1-6-250615
            input: [text, image]
            contextWindow: 200000
            maxTokens: 4096
            reasoningEfforts:
              off:
- id: acp
  config:
    provider: doubao
    model: doubao-seed-1-6-250615
